<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 720px;
    height: 405px;
    overflow: hidden;
    background: #111625;
    font-family: 'Cairo', sans-serif;
    color: #ffffff;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 36px;
  }

  /* Ambient glowing background gradients */
  .bg-glow-1 {
    position: absolute;
    top: -80px;
    right: -80px;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(117, 59, 71, 0.45) 0%, rgba(17, 22, 37, 0) 70%);
    filter: blur(30px);
    pointer-events: none;
  }
  .bg-glow-2 {
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(254, 98, 87, 0.25) 0%, rgba(17, 22, 37, 0) 70%);
    filter: blur(40px);
    pointer-events: none;
  }

  /* Geometric accent grid */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.6;
    pointer-events: none;
  }

  /* Border frame */
  .frame {
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    pointer-events: none;
  }

  /* Header row */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .subject-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(117, 59, 71, 0.35);
    border: 1px solid rgba(254, 98, 87, 0.4);
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 800;
    color: #ff9b93;
    letter-spacing: 0.5px;
    backdrop-filter: blur(8px);
  }
  .subject-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fe6257;
    box-shadow: 0 0 8px #fe6257;
  }
  .stage-tag {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.06);
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Main Title Area */
  .content-area {
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .text-col {
    max-width: 440px;
  }
  .main-title {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.25;
    color: #ffffff;
    text-shadow: 0 4px 16px rgba(0,0,0,0.5);
    margin-bottom: 8px;
  }
  .highlight {
    background: linear-gradient(135deg, #ffffff 30%, #fe6257 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.5;
  }

  /* Teacher Badge Card */
  .teacher-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(24, 26, 36, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 10px 18px 10px 14px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    z-index: 10;
    align-self: flex-start;
  }
  .avatar-wrap {
    position: relative;
    width: 64px;
    height: 64px;
  }
  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid #753b47;
    box-shadow: 0 0 14px rgba(117, 59, 71, 0.6);
  }
  .check-badge {
    position: absolute;
    bottom: -2px;
    left: -2px;
    width: 20px;
    height: 20px;
    background: #0284c7;
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    border: 2px solid #111625;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .teacher-info {
    display: flex;
    flex-direction: column;
    text-align: right;
  }
  .teacher-name {
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
  }
  .teacher-title {
    font-size: 12px;
    font-weight: 600;
    color: #fe6257;
    margin-top: 2px;
  }

  /* Footer bar inside banner */
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 12px;
    z-index: 10;
  }
  .features-list {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.65);
  }
  .feature-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .feature-dot {
    width: 5px;
    height: 5px;
    background: #38bdf8;
    border-radius: 50%;
  }
  .brand-logo {
    font-size: 12px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 1px;
  }
</style>
</head>
